version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloudmart-db
    environment:
      POSTGRES_DB: cloudmart
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmart -d cloudmart"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: cloudmart-backend
    environment:
      DB_HOST: db
      DB_NAME: cloudmart
      DB_USER: cloudmart
      DB_PASS: cloudmart_password
      DB_PORT: 5432
      JWT_SECRET: cloudmart-secure-jwt-dev-secret-key-32chars!
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cloudmart-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
