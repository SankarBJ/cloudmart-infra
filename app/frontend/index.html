<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CloudMart | Amazon-Style Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/shared.js"></script>
    <style>
        .main-layout { display: flex; max-width: 1400px; margin: 15px auto; padding: 0 15px; gap: 20px; }
        .sidebar { width: 230px; background: #fff; padding: 16px; border-radius: 8px; height: fit-content; border: 1px solid #ddd; }
        .product-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .product-card { background: #fff; border-radius: 8px; padding: 16px; border: 1px solid #ddd; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
        .product-card img { width: 100%; height: 180px; object-fit: contain; cursor: pointer; }
    </style>
</head>
<body>
    <script>renderAmazonHeader('home');</script>

    <div class="main-layout">
        <aside class="sidebar">
            <h3 style="font-size:14px; font-weight:700; border-bottom:1px solid #eee; padding-bottom:6px;">Department</h3>
            <div id="deptList" style="margin-top:10px; font-size:13px; line-height:2;"></div>
        </aside>

        <main style="flex:1;">
            <div id="productsGrid" class="product-grid">Loading CloudMart products...</div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const searchQ = urlParams.get('search') || '';
        const catQ = urlParams.get('cat') || 'All';

        async function initStorefront() {
            // Load Categories
            const cRes = await fetch(`${API}/categories`);
            const cData = await cRes.json();
            document.getElementById('deptList').innerHTML = `
                <a href="/" style="text-decoration:none; color:${catQ==='All'?'#e77600':'#111'}; font-weight:${catQ==='All'?'bold':'normal'};">All Departments</a><br>
                ${cData.categories.map(c => `
                    <a href="/?cat=${encodeURIComponent(c.category)}" style="text-decoration:none; color:${catQ===c.category?'#e77600':'#111'}; font-weight:${catQ===c.category?'bold':'normal'};">${c.category} (${c.count})</a><br>
                `).join('')}
            `;

            // Load Products
            let pUrl = `${API}/products?category=${encodeURIComponent(catQ)}`;
            if (searchQ) pUrl += `&search=${encodeURIComponent(searchQ)}`;
            const pRes = await fetch(pUrl);
            const pData = await pRes.json();

            document.getElementById('productsGrid').innerHTML = pData.products.map(p => `
                <div class="product-card">
                    <img src="${p.image_url}" alt="${p.name}" onclick="location.href='/product?id=${p.id}'">
                    <span style="font-size:11px; text-transform:uppercase; color:#777; font-weight:600;">${p.category}</span>
                    <a href="/product?id=${p.id}" style="font-size:14px; font-weight:600; color:#007185; text-decoration:none; margin:6px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.name}</a>
                    <div style="color:#e67a00; font-size:12px; margin-bottom:4px;">★ ${p.rating} (${p.rating_count}) • <span style="color:#007185;">Prime</span></div>
                    <div style="font-size:20px; font-weight:800; color:#b12704; margin-bottom:10px;">$${p.price.toFixed(2)}</div>
                    <button class="btn-checkout" style="padding:8px; font-size:13px;" onclick="location.href='/product?id=${p.id}'">View Details & Buy</button>
                </div>
            `).join('');
        }

        initStorefront();
    </script>
</body>
</html>
