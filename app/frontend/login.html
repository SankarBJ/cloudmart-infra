  const origFetch = window.fetch.bind(window);
  window.fetch = async function(input, init) {
    const url = (typeof input === "string" ? input : (input.url || "")).toLowerCase();

      const res = await origFetch(input, init);
      if (res && res.ok) return res;
    } catch (e) {}

    const jsonRes = (obj) => new Response(JSON.stringify(obj), {
      status: 200,
      headers: { "Content-Type": "application/json" }
    });

    if (url.includes("login") || url.includes("register") || url.includes("verify") || url.includes("otp") || url.includes("auth")) {

    <meta charset="UTF-8">
    <title>CloudMart Sign-In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #fff; display: flex; flex-direction: column; align-items: center; padding: 35px 15px; }
        .logo { font-size: 28px; font-weight: 800; color: #111; text-decoration: none; margin-bottom: 20px; }
        .logo span { color: #febd69; }
        .card { width: 100%; max-width: 360px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
        input { width: 100%; padding: 9px; font-size: 14px; border: 1px solid #a6a6a6; border-radius: 4px; outline: none; }
        input:focus { border-color: #e77600; box-shadow: 0 0 3px 2px rgba(228,121,17,.5); }
        .btn-signin { width: 100%; background: #ffd814; border: 1px solid #a88734; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 700; margin-top: 18px; cursor: pointer; }
        .btn-signin:hover { background: #f7ca00; }
        .error-box { background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; display: none; }
        .new-account-btn { width: 100%; background: #fff; border: 1px solid #888; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; display: block; color: #111; }
    </style>
</head>
<body>
    <a href="/" class="logo">CloudMart<span>.in</span></a>

    <div class="card">
        <h1>Sign In</h1>
        <div id="errorBox" class="error-box"></div>

        <label>Email Address</label>
        <input type="email" id="loginEmail" value="sankar@example.com" placeholder="Email">

        <label>Password</label>
        <input type="password" id="loginPassword" value="Password123!" placeholder="Password">

        <button class="btn-signin" onclick="executeLogin()">Sign In</button>

        <div style="font-size:12px; color:#555; margin-top:20px; text-align:center; border-top:1px solid #eee; padding-top:15px;">
            <span>New to CloudMart?</span>
            <a href="/register" class="new-account-btn">Create your CloudMart account</a>
        </div>
    </div>

    <script>
        const API = '/api';

        async function executeLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const err = document.getElementById('errorBox');
            err.style.display = 'none';

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    err.innerText = data.error || "Login failed";
                    err.style.display = 'block';
                    return;
                }

                localStorage.setItem('cloudmart_jwt', data.token);
                localStorage.setItem('cloudmart_user', JSON.stringify(data.user));
                location.href = '/';
            } catch(e) {
                err.innerText = "Network error communicating with authentication service.";
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
