
name: CloudMart CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-orchestrator:
    name: Health Orchestrator Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Verify test files
        run: |
          pwd
          ls -la
          find orchestrator -maxdepth 3 -type f

      - name: Run Health Orchestrator tests
        run: python -m pytest -v orchestrator/tests
