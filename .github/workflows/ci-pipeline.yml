name: CloudMart Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Backend Linting & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pyflakes

      - name: Python Code Syntax Check
        run: |
          python -m py_compile app/backend/app.py
          pyflakes app/backend/app.py

      - name: Validate Kubernetes Manifests
        run: |
          which kubectl || echo "Validating YAML structure..."
          python -c "
import yaml, glob
for f in glob.glob('k8s/*.yaml'):
    list(yaml.safe_load_all(open(f)))
    print(f'Valid YAML: {f}')
"

  docker-build:
    name: Build Container Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: false
          tags: cloudmart-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: false
          tags: cloudmart-frontend:latest
