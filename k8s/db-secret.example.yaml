# Example only. Do not commit real passwords.
# Create the live secret with:
#   kubectl create secret generic db-secret -n cloudmart \
#     --from-literal=POSTGRES_DB=cloudmart \
#     --from-literal=POSTGRES_USER=cloudmart \
#     --from-literal=POSTGRES_PASSWORD='<use a strong password>'
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: cloudmart
type: Opaque
stringData:
  POSTGRES_DB: cloudmart
  POSTGRES_USER: cloudmart
  POSTGRES_PASSWORD: CHANGE_ME
