apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-configmap
  namespace: cloudmart
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(150) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        phone_number VARCHAR(20),
        role VARCHAR(20) DEFAULT 'customer',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price NUMERIC(10, 2) NOT NULL CHECK (price >= 0),
        stock INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
        category VARCHAR(100) NOT NULL DEFAULT 'General',
        image_url TEXT,
        rating NUMERIC(2, 1) DEFAULT 4.5,
        rating_count INTEGER DEFAULT 120,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id) ON DELETE RESTRICT,
        total_amount NUMERIC(10, 2) NOT NULL CHECK (total_amount >= 0),
        shipping_address TEXT NOT NULL,
        shipping_city VARCHAR(100) NOT NULL,
        shipping_postal_code VARCHAR(20) NOT NULL,
        status VARCHAR(50) DEFAULT 'PENDING',
        payment_method VARCHAR(50) DEFAULT 'SIMULATED_CARD',
        idempotency_key VARCHAR(100) UNIQUE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS order_items (
        id SERIAL PRIMARY KEY,
        order_id INTEGER REFERENCES orders(id) ON DELETE CASCADE,
        product_id INTEGER REFERENCES products(id) ON DELETE RESTRICT,
        quantity INTEGER NOT NULL CHECK (quantity > 0),
        unit_price NUMERIC(10, 2) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS shipments (
        id SERIAL PRIMARY KEY,
        order_id INTEGER UNIQUE REFERENCES orders(id) ON DELETE CASCADE,
        current_status VARCHAR(50) DEFAULT 'ORDERED',
        warehouse_name VARCHAR(100) DEFAULT 'Chennai Central Fulfillment Center',
        current_location VARCHAR(150) DEFAULT 'Warehouse Processing Bay 4',
        latitude NUMERIC(9, 6) DEFAULT 13.0827,
        longitude NUMERIC(9, 6) DEFAULT 80.2707,
        estimated_delivery TIMESTAMP WITH TIME ZONE DEFAULT (CURRENT_TIMESTAMP + INTERVAL '2 days'),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS delivery_otps (
        id SERIAL PRIMARY KEY,
        order_id INTEGER UNIQUE REFERENCES orders(id) ON DELETE CASCADE,
        otp_code_hash VARCHAR(255) NOT NULL,
        phone_number VARCHAR(20) NOT NULL,
        is_verified BOOLEAN DEFAULT FALSE,
        attempts INTEGER DEFAULT 0,
        expires_at TIMESTAMP WITH TIME ZONE DEFAULT (CURRENT_TIMESTAMP + INTERVAL '24 hours'),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO products (name, description, price, stock, category, image_url, rating, rating_count) VALUES
    ('Echo Wave Smart Speaker with Alexa', 'Rich HD audio smart speaker with voice control.', 49.99, 50, 'Electronics', 'https://images.unsplash.com/photo-1543512214-318c7553f230?w=600&auto=format&fit=crop&q=80', 4.7, 342),
    ('Kindle Paperwhite 16GB Display', 'Glare-free 300 ppi screen with adjustable warm light.', 139.99, 35, 'Electronics', 'https://images.unsplash.com/photo-1592496431122-2349e0fbc666?w=600&auto=format&fit=crop&q=80', 4.8, 890),
    ('CloudSonic Noise Cancelling Headphones', 'Active noise cancelling with 40-hour battery life.', 89.99, 40, 'Electronics', 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80', 4.6, 520)
    ON CONFLICT DO NOTHING;
